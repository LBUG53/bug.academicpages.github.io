# Minimal Mistakes / Academic Pages configuration

# Basic Site Settings
locale                   : "en-US"
site_theme               : "air"
minimal_mistakes_skin    : "air"
title                    : "Lucian Bessmer, PhD"
title_separator          : "-"
masthead_title           : "Home"          # navbar brand link text
name                     : &name "Home"
description              : &description "Historian of American higher education studying how universities decide what they are for."
url                      : "https://lucianbessmer.com"
baseurl                  : ""
repository               : "LBUG53/bug.academicpages.github.io"

# IMPORTANT: leave empty so nothing auto-prefixes
image_path               : ""

# Keep these as BARE FILENAMES so includes that prepend "/images/" don't double it
logo                     : "favicon.png"
og_image                 : "hero_looking_wide.jpg"

# Site Author (no avatar)
author:
  name    : "Lucian Bessmer"
  bio     : "Historian of higher education who works inside the institutions he studies."
  links:
    - label: "Email"
      icon: "fas fa-envelope"
      url : "mailto:contact@lucianbessmer.com"

# Site Settings
teaser                   :
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"

# SEO / Social
social:
  type                   : Person
  name                   : "Lucian Bessmer"
  links:
    - "mailto:contact@lucianbessmer.com"

# Reading Files
include:
  - .htaccess
  - _pages
  - files

# Conversion
markdown                 : kramdown
highlighter              : rouge


# Defaults — no sidebars anywhere
defaults:
  - scope:
      path  : ""
      type  : posts
    values:
      layout         : single
      author_profile : false
      toc            : false
      toc_sticky     : false
      sidebar        : false
  - scope:
      path  : ""
      type  : pages
    values:
      layout         : single
      author_profile : false
      toc            : false
      toc_sticky     : false

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jemoji
  - jekyll-redirect-from
# Analytics
analytics:
  provider: "google-analytics"
  google:
    tracking_id: "G-Y0Y2E8EK8C"
    anonymize_ip: false